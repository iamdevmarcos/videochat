<!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>VideoCall</title>
        
            <link rel="stylesheet" href="style.css">
        
            <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        </head>
        <body>
        
 <div class="mac-screen">
            <img src="images/wallpaper.jpg" class="wallpaper">
            <header class="menu-bar">

                <!-- Left Side -->
                <div class="menu-left">
        
                    <i class="fa-brands fa-apple apple"></i>
                    <span>Edit</span>
                    <span>Video</span>
                    <span>Window</span>
                    <span>Help</span>
        
                </div>
        
                <!-- Right Side -->
        
                <div class="menu-right">
        
                    <i class="fa-solid fa-video"></i>
        
                    <i class="fa-brands fa-bluetooth-b"></i>
        
                    <i class="fa-solid fa-wifi"></i>
        
                    <span class="battery">100%</span>
        
                    <i class="fa-solid fa-battery-full"></i>
        
                    <i class="fa-solid fa-magnifying-glass"></i>
        
                    <i class="fa-solid fa-sliders"></i>
        
                    <span class="time">Wed 9:41 AM</span>
        
                </div>
        
            </header>
        

<!-- =========================
      FaceTime Window
========================= -->

<div class="facetime-window">

    <!-- Sidebar -->
    <div class="sidebar">

        <!-- Mac Buttons -->
        <div class="window-buttons">
            <span class="red"></span>
            <span class="yellow"></span>
            <span class="green"></span>
        </div>

        <!-- Top Buttons -->
        <div class="top-buttons">

            <button class="link-btn">
                <i class="fa-solid fa-link"></i>
                Create Link
            </button>

            <button class="new-btn">
                <i class="fa-solid fa-video"></i>
                New FaceTime
            </button>

        </div>

        <h4>Today</h4>

        <!-- Contact -->
        

    </div>

    <!-- =====================
            Video Area
    ====================== -->

    <div class="video-area">

        <!-- Main Image -->
        <img src="images/person.jpg.jpeg" class="main-video" alt="Main Person">

        <!-- Small Image -->
        <div class="small-video">

            <img src="images/nayab.jpeg" alt="Small Person">

        </div>

        <!-- Call Controls -->

        <div class="controls">

            <button>
                <i class="fa-solid fa-volume-high"></i>
            </button>

            <button>
                <i class="fa-solid fa-microphone"></i>
            </button>

            <button>
                <i class="fa-solid fa-video"></i>
            </button>

            <button class="end-call">
                <i class="fa-solid fa-phone-slash"></i>
            </button>

        </div>

    </div>

</div>



        <footer>
            <div class="dock">

                <a href="https://www.google.com/search?q=Finder" target="_blank" class="dock-item running">
                    <img src="images/finder.png" alt="">
                </a>
                <a href="https://www.google.com/search?q=Setting" target="_blank" class="dock-item">
                    <img src="images/setting.png" alt="">
                </a>
                <a href="https://www.google.com/search?q=Safari" target="_blank" class="dock-item running">
                    <img src="images/sifari.png" alt="">
                </a>
            
                <a href="https://www.google.com/search?q=Messages" target="_blank" class="dock-item">
                    <img src="images/message.png" alt="">
                </a>
            
                
                <a href="https://www.google.com/search?q=Music" target="_blank" class="dock-item running">
                    <img src="images/music.png" alt="">
                </a>
            
                <a href="https://www.google.com/search?q=Chrome" target="_blank" class="dock-item running">
                    <img src="images/chrome.png" alt="">
                </a>
            
                <a href="https://www.google.com/search?q=Calendar" target="_blank" class="dock-item">
                    <img src="images/calender.png" alt="">
                </a>
            
                <a href="https://www.google.com/search?q=Mail" target="_blank" class="dock-item">
                    <img src="images/appletv.png" alt="">
                </a>
                    <a href="https://www.google.com/search?q=Notes" target="_blank" class="dock-item">
                        <img src="images/notes.png" alt="">
                    </a>
                    <a href="https://www.google.com/search?q=Mail" target="_blank" class="dock-item">
                        <img src="images/mail.png" alt="">
                    </a>
                
                    <a href="https://www.google.com/search?q=linkedin" target="_blank" class="dock-item">
                        <img src="images/terminal.png" alt="">
                    </a>
                        <a href="https://www.google.com/search?q=WhatsApp" target="_blank" class="dock-item">
                            <img src="images/WhatsApp.png" alt="">
                        </a>
                    
                        <a href="https://www.google.com/search?q=Maps" target="_blank" class="dock-item">
                            <img src="images/maps.png" alt="">
                        </a>
            </div>
        </footer>
    </div>
</body>
</html>
